[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "env-guard-cli"
version = "1.0.0"
description = "Environment variable validation, secret detection, and .env file management CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Sanjay Sundar Murthy", email = "sanjaysundarmurthy@gmail.com"},
]
keywords = [
    "environment", "env", "dotenv", "validation", "secrets",
    "config", "security", "devops", "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
env-guard = "env_guard.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["env_guard"]

[project.urls]
Homepage = "https://github.com/SanjaySundarMurthy/env-guard"
Repository = "https://github.com/SanjaySundarMurthy/env-guard"
Issues = "https://github.com/SanjaySundarMurthy/env-guard/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
